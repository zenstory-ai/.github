name: Feature request
description: Propose an improvement to a ZenStory AI project
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find an equivalent request.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What user problem or limitation should be addressed?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe the desired behavior, not only a particular implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative designs have you considered?
  - type: textarea
    attributes:
      label: Additional context
      description: Add examples, mockups, or related links if useful.
