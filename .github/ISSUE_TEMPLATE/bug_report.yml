name: Bug report
description: Report a reproducible problem in a ZenStory AI project
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove secrets, personal data, and unpublished content before submitting.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the actual behavior and its impact.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction you can.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    attributes:
      label: Version or commit
      placeholder: v1.2.3 or commit SHA
  - type: textarea
    attributes:
      label: Environment
      description: Include relevant OS, runtime, browser, model, and tool versions.
  - type: textarea
    attributes:
      label: Additional context
      description: Add sanitized logs, screenshots, or links if useful.
