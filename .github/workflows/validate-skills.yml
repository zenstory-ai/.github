name: Validate shared ClawHub skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Shared skill inventory validation
    uses: zenstory-ai/.github/.github/workflows/clawhub-publish.yml@4589b4075b9cc63f1b81511e9c6df6e0b6b52ba2
    with:
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      policy_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      control_ref: 4589b4075b9cc63f1b81511e9c6df6e0b6b52ba2
      mode: validate
      manifest_path: .clawhub/publish.json
      dry_run: true
