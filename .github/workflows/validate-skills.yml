name: Validate shared ClawHub skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-shared-skills-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Shared skill inventory validation
    uses: zenstory-ai/.github/.github/workflows/clawhub-publish.yml@52ed38cf01292aa0f79b3854513457f6ea4c5420
    with:
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      policy_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      control_ref: 52ed38cf01292aa0f79b3854513457f6ea4c5420
      mode: validate
      manifest_path: .clawhub/publish.json
      dry_run: true
