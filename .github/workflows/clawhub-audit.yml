name: ClawHub daily audit

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: clawhub-central-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run public audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/clawhub_release.py audit --catalog clawhub-sources.json --output clawhub-audit.json
      - name: Synchronize deduplicated trackers in this repository only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: zenstory-ai/.github
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          report=json.load(open('clawhub-audit.json'))
          prefix='[ClawHub audit] '
          current={prefix+x['key']:x for x in report['findings']}
          raw=subprocess.run(['gh','issue','list','--repo',os.environ['GH_REPO'],'--state','open','--limit','1000','--json','number,title,body'],check=True,text=True,capture_output=True).stdout
          opened={}
          for x in json.loads(raw):
              if x['title'].startswith(prefix):
                  opened.setdefault(x['title'],[]).append(x)
          for title,items in opened.items():
              items.sort(key=lambda x:x['number'])
          for title,item in current.items():
              body=f"Automated public-data audit finding.\n\n- Status: `{item['status']}`\n- Detail: {item.get('detail','')}\n\nThis tracker is scoped to `zenstory-ai/.github`; the central audit does not publish or modify product repositories."
              if title in opened:
                  primary,*dups=opened[title]
                  if (primary.get('body') or '').strip()!=body.strip():
                      subprocess.run(['gh','issue','edit',str(primary['number']),'--repo',os.environ['GH_REPO'],'--body',body],check=True)
                  for dup in dups:
                      subprocess.run(['gh','issue','close',str(dup['number']),'--repo',os.environ['GH_REPO'],'--comment',f"Duplicate tracker superseded by #{primary['number']}."],check=True)
              else:
                  subprocess.run(['gh','issue','create','--repo',os.environ['GH_REPO'],'--title',title,'--body',body],check=True)
          for title,items in opened.items():
              if title not in current:
                  for item in items:
                      subprocess.run(['gh','issue','close',str(item['number']),'--repo',os.environ['GH_REPO'],'--comment','Recovered in the latest public-data audit.'],check=True)
          PY
      - if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clawhub-audit-${{ github.run_id }}
          path: clawhub-audit.json
          if-no-files-found: warn
          retention-days: 30
